{% extends 'base.html' %}
{% block title %}{% if member %}Edit{% else %}Add{% endif %} Member – LibraryMS{% endblock %}
{% block content %}
<div class="page-header">
  <h4 class="page-title">
    <i class="bi bi-person-{% if member %}gear{% else %}plus{% endif %} me-2"></i>
    {% if member %}Edit Member{% else %}Add New Member{% endif %}
  </h4>
  <a href="{{ url_for('admin.members') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" required value="{{ member.name if member else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" required value="{{ member.email if member else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Password {% if member %}(leave blank to keep){% else %}*{% endif %}</label>
          <input type="password" name="password" class="form-control" {% if not member %}required{% endif %}
                 minlength="6" placeholder="{% if member %}Enter new password{% else %}Min 6 characters{% endif %}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" value="{{ member.phone if member else '' }}"/>
        </div>
        <div class="col-12">
          <label class="form-label">Address</label>
          <textarea name="address" class="form-control" rows="2">{{ member.address if member else '' }}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            <option value="active" {% if not member or member.status == 'active' %}selected{% endif %}>Active</option>
            <option value="suspended" {% if member and member.status == 'suspended' %}selected{% endif %}>Suspended</option>
          </select>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check-lg me-1"></i>{% if member %}Update{% else %}Add Member{% endif %}
        </button>
        <a href="{{ url_for('admin.members') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

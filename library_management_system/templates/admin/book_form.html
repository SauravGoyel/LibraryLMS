{% extends 'base.html' %}
{% block title %}{% if book %}Edit{% else %}Add{% endif %} Book – LibraryMS{% endblock %}
{% block content %}
<div class="page-header">
  <h4 class="page-title">
    <i class="bi bi-{% if book %}pencil{% else %}plus-circle{% endif %} me-2"></i>
    {% if book %}Edit Book{% else %}Add New Book{% endif %}
  </h4>
  <a href="{{ url_for('admin.books') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card" style="max-width:700px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Book Title *</label>
          <input type="text" name="title" class="form-control" required
                 value="{{ book.title if book else '' }}" placeholder="e.g. Introduction to Algorithms"/>
        </div>
        <div class="col-md-4">
          <label class="form-label">ISBN *</label>
          <input type="text" name="isbn" class="form-control" required
                 value="{{ book.isbn if book else '' }}" placeholder="978-XXXXXXXXXX"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Author *</label>
          <input type="text" name="author" class="form-control" required
                 value="{{ book.author if book else '' }}" placeholder="Author Name"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Publisher</label>
          <input type="text" name="publisher" class="form-control"
                 value="{{ book.publisher if book else '' }}" placeholder="Publisher Name"/>
        </div>
        <div class="col-md-4">
          <label class="form-label">Year</label>
          <input type="number" name="year" class="form-control"
                 value="{{ book.year if book else '' }}" min="1800" max="2099" placeholder="2024"/>
        </div>
        <div class="col-md-4">
          <label class="form-label">Genre</label>
          <input type="text" name="genre" class="form-control"
                 value="{{ book.genre if book else '' }}" placeholder="e.g. Science, Fiction"/>
        </div>
        <div class="col-md-4">
          <label class="form-label">Total Copies *</label>
          <input type="number" name="total_copies" class="form-control" required min="1"
                 value="{{ book.total_copies if book else 1 }}"/>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check-lg me-1"></i>{% if book %}Update Book{% else %}Add Book{% endif %}
        </button>
        <a href="{{ url_for('admin.books') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
